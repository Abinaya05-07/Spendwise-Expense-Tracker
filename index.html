<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

  <!-- AUTH VIEW -->
  <main id="authView" class="auth hidden">
    <div class="card auth-card">
      <h1>💰 Expense Tracker</h1>
      <p class="muted">Track where your money goes.</p>

      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Login</button>
        <button id="tabRegister" class="tab" type="button">Register</button>
      </div>

      <form id="authForm" novalidate>
        <label id="nameRow" class="hidden">Name
          <input type="text" id="name" autocomplete="name">
        </label>
        <label>Email
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label>Password
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <p id="authError" class="error"></p>
        <button class="btn primary" id="authSubmit" type="submit">Login</button>
      </form>
    </div>
  </main>

  <!-- DASHBOARD VIEW -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <h1>💰 Expense Tracker</h1>
      <div class="user">
        <span id="userName"></span>
        <button id="logoutBtn" class="btn small" type="button">Logout</button>
      </div>
    </header>

    <main class="container">
      <section class="stats">
        <div class="card stat">
          <span class="muted">Total spent</span>
          <strong id="totalAmount">₹0.00</strong>
        </div>
        <div class="card stat">
          <span class="muted">Transactions</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="card stat">
          <span class="muted">Top category</span>
          <strong id="topCategory">—</strong>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <h2 id="formTitle">Add expense</h2>
          <form id="expenseForm" novalidate>
            <input type="hidden" id="expenseId">
            <label>Title
              <input type="text" id="title" maxlength="150" required>
            </label>
            <div class="row">
              <label>Amount (₹)
                <input type="number" id="amount" min="0.01" step="0.01" required>
              </label>
              <label>Date
                <input type="date" id="expenseDate" required>
              </label>
            </div>
            <label>Category
              <select id="category"></select>
            </label>
            <label>Note (optional)
              <input type="text" id="note" maxlength="255">
            </label>
            <p id="formError" class="error"></p>
            <div class="row">
              <button class="btn primary" id="saveBtn" type="submit">Add expense</button>
              <button class="btn" id="cancelEdit" type="button" hidden>Cancel</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h2>Spending by category</h2>
          <div class="chart-wrap">
            <canvas id="chart"></canvas>
            <p id="noChart" class="muted center hidden">No data to chart yet.</p>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="list-head">
          <h2>Expenses</h2>
          <div class="filters">
            <input type="search" id="search" placeholder="Search title…">
            <select id="filterCategory"></select>
            <input type="month" id="filterMonth">
            <button id="clearFilters" class="btn small" type="button">Clear</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th><th>Title</th><th>Category</th>
                <th class="num">Amount</th><th></th>
              </tr>
            </thead>
            <tbody id="expenseBody"></tbody>
          </table>
          <p id="emptyMsg" class="muted center hidden">No expenses found.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
